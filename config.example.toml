backend = "mlx"   # or "onnx"
model_path = "~/.cache/pii-proxi/models/mlx-8bit"
calibration_path = "~/.cache/pii-proxi/models/viterbi_calibration.json"

# Optional — all fields below have sensible defaults.
# port = 8787
# host = "127.0.0.1"
# disabled_labels = []                 # e.g. ["private_email"] to skip that class
# log_path = "~/.local/state/pii-proxi/audit.log"
# anthropic_upstream = "https://api.anthropic.com"
# openai_upstream = "https://api.openai.com"

# Logs the detected plaintext alongside each entity label. Off by default.
# Safe for a single-user local setup; do NOT enable anywhere the proxy's
# stdout/logs could be captured, uploaded, or shipped off-box.
# Must stay above any [providers.*] table — TOML scopes bare keys to the
# most recent table heading, so placing this below would silently make it
# a per-provider field instead of a top-level one.
# log_entities = true

#
# --- Multiple providers (optional) -------------------------------------------
# Register any number of upstreams under [providers.<name>]. Each provider is
# mounted at /<name> on the proxy. The legacy anthropic_upstream / openai_upstream
# keys above still work and seed default `anthropic` / `openai` providers when
# this table is absent.
#
# format = "anthropic"  -> exposes POST /<name>/v1/messages, point your
#                          Anthropic SDK at  ANTHROPIC_BASE_URL=http://127.0.0.1:8787/<name>
# format = "openai"     -> exposes POST /<name>/v1/chat/completions, point your
#                          OpenAI SDK at     OPENAI_BASE_URL=http://127.0.0.1:8787/<name>/v1
#
# [providers.openai]
# format = "openai"
# upstream = "https://api.openai.com"
#
# [providers.anthropic]
# format = "anthropic"
# upstream = "https://api.anthropic.com"
#
# DeepSeek via its Anthropic-compatible endpoint:
# [providers.deepseek]
# format = "anthropic"
# upstream = "https://api.deepseek.com/anthropic"
#
# DeepSeek via its native OpenAI-shape API:
# [providers.deepseek-oai]
# format = "openai"
# upstream = "https://api.deepseek.com"
