[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-masker"
version = "0.1.0"
description = "Local privacy-filter proxy for coding assistants (Claude Code, Codex CLI, etc)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "code-masker" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "huggingface_hub>=0.22",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.14"]
onnx = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
code-masker = "code_masker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/code_masker"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
